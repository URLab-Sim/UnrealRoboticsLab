; Cook rules that travel with the plugin.
;
; The renderer, the overlay system, the sky importer and the twist-control input
; mapping all reach their assets by path at runtime, through LoadObject. A path
; is not a hard reference, so the cooker cannot see it and will not cook the
; asset unless something says so explicitly.
;
; Until now that "something" was the HOST project's DefaultGame.ini, which the
; plugin cannot enforce and which was documented only as a manual packaging
; step. Every miss degraded silently: geoms fell back to default lighting,
; overlays drew opaque, the sky dome simply did not appear, and twist control
; had no input mappings. A packaged build looked subtly wrong with nothing in
; the log to say why.
;
; Plugin configs are merged into the project's, so declaring the rule here means
; a host project gets it by installing the plugin, and the paths cannot drift
; away from the code that loads them without the boot check in
; MjContentPaths.cpp failing loudly.

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/UnrealRoboticsLab/Materials")
+DirectoriesToAlwaysCook=(Path="/UnrealRoboticsLab/Input")
+DirectoriesToAlwaysCook=(Path="/UnrealRoboticsLab/UI")

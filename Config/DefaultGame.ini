; Cook rules that travel with the plugin.
;
; The renderer, the overlay system and the sky importer reach their materials by
; path at runtime, through LoadObject. A path is not a hard reference, so the
; cooker cannot see it and will not cook the asset unless something says so
; explicitly. Every miss degrades silently: geoms fall back to default lighting,
; overlays draw opaque, the sky dome does not appear and segmentation is not
; advertised.
;
; Plugin configs are merged into the project's, so declaring the rule here means
; a host project gets it by installing the plugin, and the paths cannot drift
; away from the code that loads them without the boot check in
; MjContentPaths.cpp failing loudly. Scripts/package_render_server_linux.sh also
; writes the same rule into the host project's DefaultGame.ini.

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/UnrealRoboticsLab/Materials")

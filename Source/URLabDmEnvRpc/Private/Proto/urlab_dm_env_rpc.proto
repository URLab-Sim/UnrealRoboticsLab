syntax = "proto3";

package urlab.dm_env_rpc.v1;

import "google/rpc/status.proto";

// Lightweight URLab encapsulation packet carried inside dm_env_rpc's
// `EnvironmentRequest.extension` and `EnvironmentResponse.extension` (field 15).
message UrlabPacket {
  // Operation identifier (e.g. "step", "hello", "spawn_actor", "camera_frame").
  string op = 1;

  // Serialized MessagePack dictionary payload or binary data.
  bytes payload = 2;

  // Correlation sequence ID for asynchronous stream matching.
  int64 sequence_id = 3;

  // Optional status reporting if an error occurred during remote dispatch.
  google.rpc.Status status = 4;
}

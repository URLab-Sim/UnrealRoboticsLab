# MoveIt executes planned trajectories through a FollowJointTrajectory action.
# The urlab trajectory_bridge node serves that action and streams each point's
# joint positions onto /<art>/joint_command (which URLab applies as control),
# so no ros2_control stack is needed on the sim side.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller
  panda_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7

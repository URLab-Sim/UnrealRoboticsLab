# Toolchains that produced the checked-in generated protobuf code.
#
# Recorded by step 02. The two sides currently DISAGREE, and one of the pairs is
# additionally inconsistent with what the bridge declares it needs. Step 04
# (blocker 6) resolves this; until then this file is the honest record.
#
# Format: key = value, one per line, '#' comments. Read by wire/regen_proto.sh
# and by the bridge's test_wire_schema.py.

# --- Unreal side: Source/URLabDmEnvRpc/Private/GenProto/*.pb.{h,cc} ----------
ue.protobuf         = 4.25.1
ue.grpc             = 1.62.0
ue.stamp_source     = Source/URLabDmEnvRpc/Private/GenProto/urlab_dm_env_rpc.pb.h:3
ue.build_script     = third_party/grpc/build.sh

# --- Python side: URLab_Bridge/src/urlab_client/transports/_dmenv/*_pb2*.py --
py.protobuf         = 7.35.1
py.grpcio_tools     = 1.83.0
py.stamp_source     = src/urlab_client/transports/_dmenv/urlab_dm_env_rpc_pb2.py:5
py.runtime_guard    = src/urlab_client/transports/_dmenv/dm_env_rpc_pb2_grpc.py:8-25

# --- Known problems, recorded not fixed -------------------------------------
# 1. The two sides were generated by protobuf majors 4 and 7. The embedded
#    descriptors are nonetheless byte-identical (wire/check_descriptors.py
#    proves it), so the wire agrees; only the generated APIs differ.
# 2. URLab_Bridge/pyproject.toml declares grpcio>=1.62.0 and protobuf>=4.25.0,
#    but the vendored Python stubs raise RuntimeError at import below
#    grpcio 1.83.0. A clean install honouring the declared floors cannot import
#    the gRPC transport. This is blocker 6.
skew.declared_py_floor_grpcio   = 1.62.0
skew.actual_py_stub_requirement = 1.83.0
skew.blocker                    = 6


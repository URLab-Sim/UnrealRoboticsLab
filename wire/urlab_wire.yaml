    typed_dispatch: lifecycle
    faces:
      zmq: {kind: req_rep, status: supported}
      grpc: {kind: req_rep, status: supported}
      shm: {kind: none, status: unsupported, note: "SHM is a negotiated data plane for Linux ZMQ sessions, never a command adapter."}
    direction: client_to_server
    reply_op: connect_ok
    request_fields_at: request_fields
    reply_fields_at: reply_fields
    request_fields:
      - {name: protocol_version, type: int, required: true, registry_required: true, value: 2, status: ok}
      - {name: data_policy, type: string, required: true, registry_required: true, values: [network, auto, shm], status: ok}
    reply_fields:
      - {name: op, type: string, value: connect_ok, status: ok}
      - {name: protocol_version, type: int, value: 2, status: ok}
      - {name: instance_id, type: string, status: ok}
      - {name: boot_id, type: string, status: ok}
      - {name: session_id, type: string, status: ok}
      - {name: urlab_version, type: string, status: ok}
      - {name: command_endpoints, type: array<string>, status: ok}
      - {name: services, type: array<string>, status: ok}
      - {name: permissions, type: array<string>, status: ok}
      - {name: data_offers, type: array<string>, status: ok}
      - {name: data_negotiation, type: tagged_map, tag: transfer, variants: [network, shm], status: ok}
      - {name: limits, type: object, status: ok}
      - {name: max_sessions, type: int, location: limits, value: 16, status: ok}
      - {name: session_idle_timeout_s, type: float, location: limits, value: 300.0, status: ok}
    errors:
      - {code: missing_field, when: "protocol_version or data_policy is absent"}
      - {code: bad_request, when: "protocol_version/data_policy has the wrong type/value or an unknown request field is present"}
      - {code: busy, when: "all bounded session slots are active"}
      - {code: not_ready, when: "the dispatcher has no owning bridge"}
      - {code: shm_unavailable, when: "data_policy requires SHM but this adapter/host cannot offer it"}


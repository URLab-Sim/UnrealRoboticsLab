  data_select_network:
    fields: {transfer: {type: literal, value: network}}
  data_select_shm:
    fields: {transfer: {type: literal, value: shm}, region_id: {type: nonempty_string}, region_generation: {type: positive_int64}}
  data_select:
    tagged: {field: transfer, variants: {network: data_select_network, shm: data_select_shm}}
  payload_begin_network:
    fields: {transfer: {type: literal, value: network}, blob_id: {type: nonempty_string}, max_chunk_bytes: {type: positive_int64}, expires_in_s: {type: finite_float}}
  payload_begin_shm:
    fields: {transfer: {type: literal, value: shm}, blob_id: {type: nonempty_string}, region_id: {type: nonempty_string}, region_generation: {type: positive_int64}, object_name: {type: nonempty_string}, byte_length: {type: positive_int64}, sha256: {type: string}, expires_in_s: {type: finite_float}}
  payload_begin:

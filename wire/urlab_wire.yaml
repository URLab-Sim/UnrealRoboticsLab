  notes:
    not_nested: >
      The tiered topics deliberately do NOT sit under `render`. ZMQ matches
      subscriptions by PREFIX, so a topic beginning `render...` would be delivered
      to every lean subscriber subscribed to `render` -- precisely the leak that
      scoping capabilities per subscription removed. They live under their own
      root instead, and neither root is a prefix of the other.
    trailing_slash: >
      The trailing separator is load-bearing for the same reason: without it
      `...m1` is a prefix of `...m10`, and a subscriber capped at one contact would
      also receive the frames built for one capped at ten.
    cap_pinned_when_contacts_off: >
      The cap is pinned to 0 whenever contacts are off, so the topic is canonical
      for a given capability set: two subscribers wanting the same thing land on the
      same topic and the owner builds that frame once.
    lean_is_the_default: >
      Asking for nothing yields `lean`, so a lean subscriber needs no special case at
      the call site.

  implementations:
    ue: "Private/Transport/RenderBusTopics.cpp — ForCaps / IsTiered / ParseCaps"
    py: "src/urlab_client/owner_faces.py — topic_for_caps_key / caps_from_topic"

cli_flags:

  URLabWorkflow:
    doc: >
      Canonical process workflow selector. An unrecognised value is refused.
      The retired URLabDrive flag is explicitly rejected by the boot parser.
    parser: "Private/MuJoCo/Render/MjLauncherFlags.cpp ParseWorkflow"
    kind: single_value
    values_from_enum: workflow

  URLabSimulationSource:
    doc: >
      Path to a JSON manifest with the exact shape
      {format:'mjb'|'mjz'|'xml',path:'...',assets?:{vfsName:'filePath'}}.
      Valid only with URLabWorkflow=simulation. If absent, the simulation service starts model-free.
    parser: "Private/MuJoCo/Render/MjLauncherFlags.cpp SimulationSourceManifest"
    kind: single_value

  URLabClock:
    doc: >
      Local simulation clock mode. `stepped` is the inert default; `freerun`
      advances from the world subsystem's monotonic elapsed time. Valid only for
      a simulation workflow, including a normal map boot with an authored source.
    parser: "Private/MuJoCo/Render/MjLauncherFlags.cpp ParseClock"
    kind: single_value
    values:
      - {token: "stepped", doc: "advance only through explicit simulation_step requests"}
      - {token: "freerun", doc: "advance from monotonic world elapsed time"}

  URLabSourceFind:
    doc: "Owner discovery mode."
    parser: "Private/MuJoCo/Render/MjLauncherFlags.cpp SourceFindDiscover / SourceFindBrowse"
    kind: single_value
    values:
      - {token: "discover", suffix: "[:scene]", doc: "auto-join the first or scene-matching advertised owner"}
      - {token: "browse", doc: "interactive server-browser UI; non-headless"}

  URLabCaps:
    doc: >
      Capability CSV. Absent means lean: every capability is off unless a rule
      below implies it. A leading '-' on a token negates it. The tokens ARE the
      capability names in `capability_model` -- one spelling, not a second
      vocabulary that has to be kept in step with the first.
    parser: "Private/MuJoCo/Render/MjLauncherFlags.cpp ParseCaps"
    kind: csv_tokens
    negatable: true
    tokens: [rpc, discoverable, pose_stream, camera_frames, camera_rpc, accept_input, accept_model_load, free_fly_pawn]
    implied:
      rpc: >
        implied by drive=sim, by drive=request (it serves the requests that
        drive it), by a subscribing consumer that is not subscribe-only, and by
        free_fly_pawn (its bridge is how a producer drives it). Naming the token
        either way overrides the implication.
      camera_frames: >
        implied on an instance that boots with no model, because answering
        render requests is the only reason such an instance exists.
      accept_model_load: "granted unless drive == sim; see capability_model"

  URLabScene:
    doc: "Scene tuning and placement CSV."
    parser: "Private/MuJoCo/Render/MjLauncherFlags.cpp (Scene* readers)"
    kind: csv_keys
    keys:
      - {key: level,        type: str,  doc: "level to open"}
      - {key: origin,       type: str,  doc: "X;Y;Z in UE centimetres — SEMICOLON separated, since commas delimit keys"}
      - {key: base,         type: flag, doc: "boot map is a curated scene; skip importing the model environment"}
      - {key: quality,      type: str,  values: [off], doc: "skip applying renderer quality settings"}
      - {key: cammax,       type: int,  doc: "cap each model camera's capture height; 0 = uncapped"}
      - {key: camnear,      type: float, unit: centimetre, doc: "camera near-clip plane"}
      - {key: noexposure,   type: flag, doc: "disable auto-exposure"}
      - {key: overlay,      type: int,  doc: "mjVIS_* bitmask; also negotiates the owner's debug tier"}
      - {key: maxcontacts,  type: int,  doc: "cap on contacts the owner serialises; 0 = uncapped"}

  URLabNet:
    doc: "Networking CSV. THE FLAG THE PYTHON FARM LAUNCHER GETS WRONG."
    parser: "Private/Bridge/BridgeServerConfigUtils.cpp:194-249"
    kind: csv_keys
    keys:
      - {key: id,       type: str, doc: "instance id", parser_line: 200}
      - {key: index,    type: int, doc: "instance index; offsets the port block", parser_line: 202}
      - {key: portbase, type: int, doc: "base of the ZMQ port block", parser_line: 204}
      - {key: stride,   type: int, doc: "spacing between instance port blocks", parser_line: 206}
      - {key: step,     type: int, doc: "step REQ/REP port", parser_line: 208}
      - {key: state,    type: int, doc: "state PUB port", parser_line: 213}
      - {key: bus,      type: int, doc: "render bus port", parser_line: 219}
      - {key: cam,      type: int, doc: "camera base port", parser_line: 221}
      - {key: bind,     type: str, doc: "bind address", parser_line: 226}
      - {key: grpc,     type: int, doc: "gRPC listen port; default 50051", parser_line: 239}
    drift:
      what: >
        The Python farm launcher emits -URLabInstanceIndex=, -URLabPortBase= and
        -URLabPortStride=, which this repo deleted. Nothing
        parses them, so every farm node boots at index -1 on the default port.
        The launcher's own unit test pins the dead spelling as correct.
      ue: "Private/Bridge/BridgeServerConfigUtils.cpp:194-227 (only -URLabNet= keys are read)"
      py: "src/urlab_farm/launcher.py:280-282; tests/test_farm_launcher.py:83-85"
      blocker: 2
      resolution: P12_no_silent_tolerance
    note: >
      `grpc` is not plumbed like its siblings: it is implemented by appending an
      internal -URLabDmEnvPort= to the process command line rather than reaching
      the transport through config (BridgeServerConfigUtils.cpp:232-249).


# Owner re-broadcast is NOT a command-line flag, despite what several comments
# and every previous doc claimed. There is no CLI parser for
# `-URLabBroadcastOnRenderBus` anywhere in Source/. It is reached two ways:
#   env  URLAB_BROADCAST_ON_RENDER_BUS      (BridgeServerConfigUtils.cpp:198)
#   flag -URLabCaps=publish           (the `publish` capability token)
# A stale comment at DmEnvRpcTransport.cpp:126 still names it as a flag.
non_cli_switches:
  broadcast_on_render_bus:
    env: URLAB_BROADCAST_ON_RENDER_BUS
    caps_token: pose_stream
    reader: "Private/Bridge/BridgeServerConfigUtils.cpp:190-198"
    status: drift
    drift:
      what: "Documented for a year as the CLI flag -URLabBroadcastOnRenderBus, which has never had a parser."
      resolution: RESOLVED    # docs corrected; schema no longer emits it as a flag

# --- deleted flags. Recorded so a generator can assert nobody emits them. ----
cli_flags_deleted:
  doc: >
    Deleted flags and deleted flag VALUES. They parse as nothing (or, for a
    value, are refused), so a script still passing one boots a server that never
    serves. Kept here as a denylist, not as an alias table: the pre-release rule
    is no backward compatibility.
  flags:
    - {flag: URLabInstanceIndex, replaced_by: "URLabNet=index=", still_emitted_by: "src/urlab_farm/launcher.py:280"}
    - {flag: URLabPortBase,      replaced_by: "URLabNet=portbase=", still_emitted_by: "src/urlab_farm/launcher.py:281"}
    - {flag: URLabPortStride,    replaced_by: "URLabNet=stride=", still_emitted_by: "src/urlab_farm/launcher.py:282"}
    - {flag: URLabFastMjb,       replaced_by: "URLabSimulationSource=<manifest.json>"}
    - {flag: URLabFastXml,       replaced_by: "URLabSimulationSource=<manifest.json>"}
    - {flag: URLabFastMjz,       replaced_by: "URLabSimulationSource=<manifest.json>"}
    - {flag: URLabFastBus,       replaced_by: "URLabDrive=subscribe:tcp://<ep>"}
    - {flag: URLabFastGrpcJoin,  replaced_by: "none", note: "gRPC is render request/reply only and is not a viewer bus"}
    - {flag: URLabFastServe,     replaced_by: "URLabDrive=request -URLabCaps=rpc", note: "the intermediate spelling URLabDrive=await was itself retired by the drive collapse; `await` is not a drive"}
    - {flag: URLabFastForcedOnly, replaced_by: "URLabDrive=request", note: "`push` named what the SENDER did and was retired with the rest of that vocabulary"}
    - {flag: URLabFastDirect,    replaced_by: "URLabDrive=sim"}
    - {flag: URLabFastConnect,   replaced_by: "URLabDrive=subscribe:<control>"}
    - {flag: URLabFastDiscover,  replaced_by: "URLabSourceFind=discover"}
    - {flag: URLabFastAutoJoin,  replaced_by: "URLabSourceFind=discover:<scene>"}
    - {flag: URLabFastBrowser,   replaced_by: "URLabSourceFind=browse"}
    - {flag: URLabFastCameras,   replaced_by: "URLabCaps=camera_frames,camera_rpc", note: "`cameras` was one token for two things -- building the cameras and authorising the ops against them -- and split in item 19"}
    - {flag: URLabVrViewer,      replaced_by: "URLabCaps=free_fly_pawn", note: "`vr` was demoted to a local capability and renamed in item 19; it names a free-fly pawn, not a headset"}
    - {flag: URLabStateSource,   replaced_by: "URLabDrive=subscribe:<endpoint>"}
    - {flag: URLabFastLevel,     replaced_by: "URLabScene=level="}
    - {flag: URLabFastOrigin,    replaced_by: "URLabScene=origin=X;Y;Z"}
    - {flag: URLabFastBaseLevel, replaced_by: "URLabScene=base"}
    - {flag: URLabFastNoQuality, replaced_by: "URLabScene=quality=off"}
    - {flag: URLabFastCamMaxHeight, replaced_by: "URLabScene=cammax="}
    - {flag: URLabCamNearClip,   replaced_by: "URLabScene=camnear="}
    - {flag: URLabDisableAutoExposure, replaced_by: "URLabScene=noexposure"}
    - {flag: URLabDmEnvPort,     replaced_by: "URLabNet=grpc=", note: "still used INTERNALLY as the transport's own reader; not a public flag"}
    - {flag: URLabModel,         replaced_by: "URLabSimulationSource=<manifest.json>", note: "simulation source format/path/assets are declared together; render workflows use their own scene contract"}

# --- deleted flag VALUES. Same rule, one level down: a token that used to be
# accepted and no longer is. A launcher passing one is refused, not ignored.
cli_values_deleted:
  URLabDrive:
    - {value: stream, replaced_by: "subscribe:<endpoint>"}
    - {value: push,   replaced_by: "request"}
    - {value: await,  replaced_by: "request (or subscribe:) with no model -- a model arriving is not a pose source"}
  URLabCaps:
    - {value: serve,   replaced_by: "rpc"}
    - {value: publish, replaced_by: "discoverable,pose_stream", note: "compound: a service and an output"}
    - {value: cameras, replaced_by: "camera_frames,camera_rpc", note: "compound: an output and a permission"}
    - {value: input,   replaced_by: "accept_input"}
    - {value: vr,      replaced_by: "free_fly_pawn"}

# ---------------------------------------------------------------------------
# Not a message: the discovery record owners write to the shared registry dir.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------

registry_entry:
  doc: >
    Not a message: a JSON file on disk, one per running instance, in a directory both
    repos resolve identically. It is the broker-less discovery mechanism — a viewer, a
    pool or a session browser learns what is running by globbing it. It behaves like a
    message with no schema, no version and no writer coordination: two independent
    writers, four independent reader loops, three different liveness rules, and one key
    carrying two disjoint vocabularies.
  kind: file
  faces:
    filesystem:
      dir_resolution: "$URLAB_REGISTRY_DIR, else %LOCALAPPDATA%/URLab/registry on Windows, else ${XDG_CACHE_HOME:-~/.cache}/URLab/registry"
      ue: "Private/Bridge/InstanceRegistry.cpp:42-58"
      py: "src/urlab_client/pool.py:83-100"
      status: ok
  filename:
    ue: "Private/Bridge/InstanceRegistry.cpp:60-65 — '{instance_id}_{pid}.json'"
    py: "src/urlab_client/render_owner.py (registry_path) — 'render_{instance_id}_{pid}.json'"
    status: drift
    drift:
      what: "Different filename shapes for the same record. Every reader globs *.json and filters on content, so the names never collide, but neither side can identify the other's file by name."
      resolution: P9_one_registry_schema
  writers:
    ue:
      where: "Private/Bridge/InstanceRegistry.cpp:67-148 (WriteEntry), refreshed by :150-153 (RefreshEntry)"
      called_from: "Private/Bridge/BridgeServer.cpp:153 (WriteRegistryEntry on Start), :180 (10 s heartbeat ticker), removed at :389 (RemoveEntry on stop)"
      note: >
        The audit's A.7 cites BridgeServer.cpp:152,159-161,389 for these calls. The
        actual lines are :153 (the WriteRegistryEntry() call), :165-173 (the method) and
        :175-184 (the heartbeat); :389 is correct for RemoveEntry. This runs for the
        packaged AAMjManager-owned server as well as the editor subsystem, so a packaged
        owner does register.
    py:
      where: "src/urlab_client/render_owner.py:313-357 (_write_registry), heartbeat at :359-360, period 10 s"
  write_atomicity:
    ue: "Private/Bridge/InstanceRegistry.cpp:146-147 — MakeDirectory then FFileHelper::SaveStringToFile straight onto the live path"
    py: "src/urlab_client/render_owner.py:350-354 — os.makedirs, tempfile.mkstemp in the same directory, os.replace"
    status: drift
    drift:
      what: >
        UE overwrites the entry in place. Every reader on this box globs the directory
        and json-parses whatever it finds, on its own schedule, so a read landing inside
        a UE rewrite sees a truncated file. Three of the four readers swallow the parse
        failure and skip the entry, which turns a torn write into a live instance
        silently vanishing from discovery for one poll; the Python writer cannot produce
        this because it writes to a temp file and renames.
      ue: "InstanceRegistry.cpp:146-147"
      py: "render_owner.py:350-354"
      resolution: P9_one_registry_schema
  readers:
    count: 4
    loops:
      - name: ue_driver_discovery
        where: "Private/MuJoCo/Render/MjDriverDiscovery.cpp:50-117"
        filters: "IsOwnerEntry (:23-48) — role == render_owner OR render_owner in capabilities; then requires a non-empty `control`"
        liveness: "mtime TTL 30 s (:63,:71-74) AND dead-pid prune via FPlatformProcess::IsApplicationRunning (:110-113)"
        reads: [instance_id, scene, host, control, bus, ngeom, pid]
      - name: ue_level_ops
        where: "URLabEditor/Private/MjLevelOps.cpp:711-770 (DiscoverRenderDrivers)"
        filters: "the same shared IsOwnerEntry predicate (:751); then requires a non-empty `control`"
        liveness: "mtime TTL 30 s (:724,:732-735) ONLY — no pid check anywhere in the loop"
        reads: [instance_id, scene, host, control, bus, ngeom, pid]
        note: >
          This file lives in Source/URLabEditor/, not Source/URLab/, so its path is the
          one entry here that is not relative to the schema's usual root. It reads `pid`
          into FMjDriverInfo and then never uses it for liveness — a copy of the
          discovery loop that lost its prune.
      - name: py_pool_read_registry
        where: "src/urlab_client/pool.py:324-360, entry parse at :263-290"
        filters: "none — deliberately role-agnostic (docstring at :74-76); is_owner_entry (:66-80) exists for callers that want to filter"
        liveness: "dead-pid via InstanceInfo.is_alive (:240-244, :355) AND mtime TTL 30 s via is_stale (:246-252, :357); both suppressible with include_dead / include_stale"
        reads: [instance_id, index, pid, host, step_port, state_port, cam_base_port, manager_present, busy, urlab_version, capabilities, ngeom, registry_written_at]
      - name: py_session_discover_owners
        where: "src/urlab_client/session.py:143-181, entry parse at :95-118"
        filters: "is_owner_entry (:96)"
        liveness: "dead-pid ONLY (:169-175), and only when _is_local_host(owner.host) says the pid is meaningful here (:131-140); NO mtime TTL at all. It also DELETES the file it judges dead (:171-174)"
        reads: [role, capabilities, transports, host, instance_id, scene, bus, control, grpc, ngeom, pid, registry_written_at]
    liveness_rules:
      count: 3
      drift:
        what: >
          Four loops over one directory implement three different definitions of a live
          instance. MjDriverDiscovery and pool.read_registry require both a fresh mtime
          and a running pid. MjLevelOps requires only a fresh mtime, so a crashed owner
          whose file is still inside the 30 s window is offered to the editor as
          joinable. session.discover_owners requires only a running pid and applies no
          TTL, so an owner that stopped heartbeating but whose process is still alive
          stays listed forever, while a remote owner (whose pid cannot be checked from
          here, by design) is never filtered by anything at all. The same registry
          directory therefore yields three different answers to "what is running"
          depending on which code asks.
        ue: "MjDriverDiscovery.cpp:63,71-74,110-113 vs URLabEditor/Private/MjLevelOps.cpp:724,732-735"
        py: "pool.py:355-358 vs session.py:169-175"
        resolution: P9_one_registry_schema
    extra_copy:
      what: "The session hello's `instance` block (RpcDispatcher.cpp:743-768) is a third hand-written copy of this field list, and the Python writer at render_owner.py:315-348 is a fourth. No two of the four agree."
      resolution: P4_one_handshake_shape

  fields:
    - name: instance_id
      type: string
      default: "live (UE, when Cfg.InstanceId is empty)"
      status: ok
      emit: {ue: "InstanceRegistry.cpp:71", py: "render_owner.py:316"}
      parse: {ue: "MjDriverDiscovery.cpp:96; MjLevelOps.cpp:757", py: "pool.py:274; session.py:105"}

    - name: index
      type: int
      status: drift
      doc: "Instance index in a farm; the basis of the derived port block."
      emit: {ue: "InstanceRegistry.cpp:72 (Cfg.InstanceIndex)", py: null}
      parse: {ue: null, py: "pool.py:270"}
      drift:
        what: >
          The Python writer emits no `index`, so pool.py:270 defaults it to 0 for every
          Python owner. That 0 is then fed to _derive_ports (:146-152) and becomes the
          fallback port block for instance 0, base 5559. See step_port.
        ue: "InstanceRegistry.cpp:72"
        py: "render_owner.py:315-348 (absent)"
        resolution: P9_one_registry_schema

    - name: [pid, host]
      type: "int / string"
      status: ok
      doc: "Writer's process id and hostname. `pid` is the liveness key for three of the four readers."
      emit: {ue: "InstanceRegistry.cpp:73-74 (FPlatformProcess::ComputerName)", py: "render_owner.py:319-320 (socket.gethostname / advertise_host)"}
      parse: {ue: "MjDriverDiscovery.cpp:98,102", py: "pool.py:275-277; session.py:103,115"}

    - name: [step_port, state_port, cam_base_port]
      type: int
      status: drift
      doc: "The canonical port block. UE writes its real configured ports."
      emit: {ue: "InstanceRegistry.cpp:75-77", py: "render_owner.py:332-334 — step_port is the control REP port; state_port and cam_base_port are written as literal 0"}
      parse: {ue: null, py: "pool.py:278-280"}
      drift:
        what: >
          The Python owner writes 0 for state_port and cam_base_port because it has
          neither a full-state PUB nor a camera SHM block. pool.py reads them as
          `int(data.get("step_port", step) or step)` — the `or` treats the explicit 0 as
          absent and substitutes the index-derived port. Since a Python entry also has no
          `index`, that derivation is base 5559 + 0, so every Python owner is advertised
          to the pool as listening on 5560 and 5561, which nothing is bound to. A
          deliberate "no such port" becomes a confident wrong port.
        ue: "InstanceRegistry.cpp:75-77"
        py: "render_owner.py:332-334 vs pool.py:271,278-280,146-152"
        resolution: P9_one_registry_schema

    - name: [manager_present, busy]
      type: bool
      status: ok
      doc: "UE reports the live manager and the lease; a Python owner is always its own manager and never tracks busy."
      emit: {ue: "InstanceRegistry.cpp:78-79", py: "render_owner.py:337-338 (hardcoded True / False)"}
      parse: {ue: null, py: "pool.py:281-282"}

    - name: urlab_version
      type: string
      status: phantom
      doc: "Build version of the writer."
      emit: {ue: "InstanceRegistry.cpp:80", py: null}
      parse: {ue: null, py: "pool.py:283"}
      drift:
        what: "The Python writer omits it entirely, so every Python owner reads back with an empty urlab_version and a pool cannot tell what it is talking to."
        resolution: P9_one_registry_schema

    - name: capabilities
      type: array<string>
      status: drift
      doc: "See the `capability` enum. This single key carries two of its six vocabularies."
      emit: {ue: "InstanceRegistry.cpp:82-84,103,132 — site A (render_sync, render_async, model_upload, content_cache) plus the site-D literal render_owner appended only when broadcasting", py: "render_owner.py:318 — site C, sorted (accept_input, camera_rpc, render_owner)"}
      parse: {ue: "MjDriverDiscovery.cpp:36-46 (IsOwnerEntry: membership test for render_owner only)", py: "pool.py:66-80,284; session.py:99"}
      drift:
        what: >
          Two disjoint vocabularies under one key. The only token they share is
          `render_owner`, which is why the shared IsOwnerEntry / is_owner_entry
          predicate works at all. Everything else is incomparable: a pool filtering on
          `camera_rpc` (pool.py:254-260 has_caps) can never match a UE owner, because
          UE's registry array names build features and never the runtime grants — it puts
          those in the session hello's instance block instead
          (RpcDispatcher.cpp:763,765), which no registry reader ever sees.
        ue: "InstanceRegistry.cpp:30-40,132"
        py: "render_owner.py:42-63,318"
        resolution: P4_one_handshake_shape

    - name: role
      type: string
      value: render_owner
      values: [render_owner, bridge]   # an owner that publishes, or any other bridge instance
      status: drift
      doc: "Owner marker; site D of the `capability` enum. Written unconditionally now: a non-owner writes `bridge` rather than omitting the key, so a reader never has to treat absence as meaningful."
      emit: {ue: "InstanceRegistry.cpp:105 — ONLY inside the `if (Cfg.bBroadcastOnRenderBus)` block at :101", py: "render_owner.py:317 — unconditional"}
      parse: {ue: "MjDriverDiscovery.cpp:32", py: "pool.py:78; session.py:98,108"}
      drift:
        what: >
          A conditional key: a non-broadcasting UE instance writes an entry with no `role`
          at all, and along with it no `control`, no `bus`, no port block, no `scene`,
          no `ngeom` and no `grpc` — the same file is two different shapes depending on a
          launch flag. Every reader compensates by treating a missing key as empty, and
          session.py:108 goes further and substitutes OWNER_ROLE when `role` is empty on
          an entry that already passed is_owner_entry, so the value it reports is
          sometimes invented rather than read.
        ue: "InstanceRegistry.cpp:101-131"
        py: "render_owner.py:317; session.py:108"
        resolution: P4_one_handshake_shape

    - name: [control, bus]
      type: string
      format: uri
      status: drift
      doc: "Control REP endpoint and transform-bus PUB endpoint."
      emit: {ue: "InstanceRegistry.cpp:106-109 (tcp://<ComputerName>:<StepPort> and :<RenderBusPort>) — broadcast-only", py: "render_owner.py:323,325"}
      parse: {ue: "MjDriverDiscovery.cpp:99-100 (a driver with no `control` is dropped at :103-106); MjLevelOps.cpp:760-761,764", py: "session.py:110-112 (pool.read_registry reads neither)"}
      drift:
        what: "The two UE readers require `control` and drop the entry without it; the two Python readers require nothing and will hand back an owner with `control: None`."
        resolution: P9_one_registry_schema

    - name: [control_port, bus_port]
      type: int
      status: dead
      doc: "Writer-private port numbers, redundant with the URIs beside them."
      emit: {ue: null, py: "render_owner.py:324,326 (control_port, bus_port)"}
      parse: {ue: null, py: null}
      note: >
        Only Python writes these; no reader reads either, and both are redundant with
        the URIs beside them. UE writes the canonical step_port / state_port /
        cam_base_port block instead.
      resolution: P9_one_registry_schema

    - name: scene
      type: string
      status: ok
      doc: "Scene name for a browser listing. UE sets it equal to instance_id."
      emit: {ue: "InstanceRegistry.cpp:111 (broadcast-only)", py: "render_owner.py:321"}
      parse: {ue: "MjDriverDiscovery.cpp:97; MjLevelOps.cpp:758", py: "session.py:107"}

    - name: ngeom
      type: int
      status: drift
      doc: "Geom count, displayed in the browser."
      emit: {ue: "InstanceRegistry.cpp:117 — ALWAYS 0", py: "render_owner.py:322 (the real count)"}
      parse: {ue: "MjDriverDiscovery.cpp:101 and MjLevelOps.cpp:762 — GetIntegerField, unguarded", py: "pool.py:285; session.py:114"}
      drift:
        what: >
          WriteEntry takes Ngeom as a parameter defaulted to 0 (Public/Bridge/
          InstanceRegistry.h:42-47) and neither call site passes it: BridgeServer.cpp:170
          and :180 both stop at bBusy. The comment at InstanceRegistry.cpp:113-116 says
          the key is written unconditionally so a reader's GetIntegerField finds
          something — which it does, and that something is always 0. A UE owner is
          listed in every browser as having no geometry, while the same handler's
          `render_hello` reports the true count.
        ue: "InstanceRegistry.cpp:117 vs Private/Bridge/BridgeServer.cpp:170,180"
        py: "render_owner.py:322"
        resolution: P3_ints_as_ints

    - name: transports
      type: array<string>
      status: ok
      doc: "Which transports reach this owner. Always contains zmq; grpc is appended conditionally."
      emit: {ue: "InstanceRegistry.cpp:92-93,127,133", py: "render_owner.py:341"}
      parse: {ue: null, py: "session.py:100-102,110 — falls back to ['zmq'] + (['grpc'] if grpc) when the key is absent"}

    - name: grpc
      type: "string | null"
      status: drift
      doc: "dm_env_rpc endpoint as host:port, no scheme. Explicitly null rather than absent when not offered."
      emit: {ue: "InstanceRegistry.cpp:94,125-130,134", py: "render_owner.py:342 (None until start_grpc_server has run)"}
      parse: {ue: null, py: "session.py:102,113"}
      drift:
        what: >
          UE advertises a gRPC endpoint whenever the instance broadcasts and
          Cfg.DmEnvPort > 0, and DmEnvPort defaults to 50051 (Public/Bridge/
          BridgeServerConfig.h:102). Nothing checks that the URLabDmEnvRpc module is
          built into the binary or that anything is listening; the config comment at
          InstanceRegistry.cpp:119-124 says a caller can set the port to 0 to suppress
          the advertisement, which means the default behaviour is to advertise. A
          discovering session therefore reads a grpc endpoint on the well-known port from
          a build that has no gRPC server, dials it, and fails at connect time rather
          than at discovery time. The Python owner has the opposite behaviour: the key is
          null until the server is actually running.
        ue: "InstanceRegistry.cpp:125-130 with Public/Bridge/BridgeServerConfig.h:102"
        py: "render_owner.py:341-342"
        resolution: P9_one_registry_schema

    - name: [grpc_port, heartbeat]
      type: "int / number"
      status: phantom
      doc: "Present in the design document's registry schema."
      emit: {ue: null, py: null}
      parse: {ue: null, py: null}
      note: >
        Neither key is written or read anywhere in either repository — verified by grep
        across UnrealRoboticsLab@1c29242 and URLab_Bridge@40d2d27. They exist only in the
        target schema. The heartbeat they describe is real but is carried implicitly by
        the file's mtime and by `registry_written_at`, and the gRPC port is carried inside
        the `grpc` string.
      resolution: P9_one_registry_schema

    - name: registry_written_at
      type: "string | int"
      unit: "ISO-8601 UTC / epoch second"
      status: drift
      doc: "Writer's heartbeat stamp."
      emit: {ue: "InstanceRegistry.cpp:139 — FDateTime::UtcNow().ToIso8601(), a string", py: "render_owner.py:347 — int(time.time()), an epoch integer"}
      parse: {ue: "not read at all; both UE readers use the file's mtime instead (MjDriverDiscovery.cpp:71, MjLevelOps.cpp:732)", py: "pool.py:155-172 and session.py (_normalize_time) accept both shapes"}
      drift:
        what: >
          One key, two types. The Python readers each carry a _normalize_time helper
          (pool.py:155-172) whose whole job is to accept the other writer's shape, and
          the comment there records that the two helpers must be kept identical by hand.
          The UE readers sidestep the disagreement entirely by ignoring the field and
          trusting mtime, which is why a UE reader's notion of freshness survives a
          copied or touched file and a Python reader's does not.
        ue: "InstanceRegistry.cpp:136-139"
        py: "render_owner.py:343-347; pool.py:155-172"
        resolution: P3_ints_as_ints

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Not a message: the dm_env_rpc transport layer, as it is actually used.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------

grpc_envelope:
  doc: >
    The gRPC face is the DeepMind dm_env_rpc service carrying URLab render extension
    requests and replies. Each supported render op travels as a UrlabPacket packed into
    EnvironmentRequest.extension, whose payload is the same msgpack body the ZMQ face
    sends. Not one Tensor, TensorSpec or action/observation spec is ever populated: the
    protocol's entire design surface is inert, and what is actually load-bearing is a
    four-field wrapper message.
  transport: grpc
  service: "dm_env_rpc.v1.Environment/Process (bidirectional stream)"
  proto:
    files: ["dm_env_rpc.proto (4722 B descriptor)", "urlab_dm_env_rpc.proto (179 B descriptor)"]
    ue: "URLabDmEnvRpc/Private/Proto/urlab_dm_env_rpc.proto, generated into Private/GenProto/"
    py: "src/urlab_client/transports/_dmenv/*_pb2.py (vendored copies of the UE-generated output)"
    descriptors_identical: true
    note: >
      There is no copy of either .proto in URLab_Bridge; _dmenv/__init__.py:1-6 points a
      reader at the UE Proto directory and gives a protoc command line in a docstring.
    status: ok

  packet:
    message: urlab.dm_env_rpc.v1.UrlabPacket
    carried_in: "EnvironmentRequest.extension / EnvironmentResponse.extension (google.protobuf.Any, field 15)"
    fields:
      - name: op
        type: string
        field_number: 1
        status: drift
        doc: "Operation identifier, duplicated from the msgpack body."
        emit: {ue: "URLabDmEnvRpc/Private/Transport/DmEnvRpcClientTransports.cpp:128-137 — lifted back OUT of the msgpack body it was packed into", py: "src/urlab_client/transports/grpc.py:225-227"}
        parse: {ue: "URLabDmEnvRpc/Private/Transport/DmEnvRpcTransport.cpp", py: "src/urlab_client/owner_server.py"}
        drift:
          what: >
            The two servers dispatch on different keys. The UE server routes `subscribe`
            off UrlabPacket.op (DmEnvRpcTransport.cpp:121) and then, for everything else,
            throws the packet op away and hands the raw payload to the ZMQ dispatcher,
            which re-parses the msgpack body and switches on the `op` INSIDE it
            (:185-192). The Python owner does the reverse: it switches on
            UrlabPacket.op for every op (owner_server.py:74,109) and unpacks the body
            only to read its arguments (:112-116). This works solely because both
            clients set both copies, from the same source string. A packet whose two ops
            disagree is dispatched two different ways by the two servers, and neither
            validates them against each other.
          ue: "DmEnvRpcTransport.cpp:121,185-192"
          py: "owner_server.py:74,109-112"
          resolution: P10_grpc_envelope
        note: >
          The audit's A.9 says UE ignores UrlabPacket.op outright. It does for the
          request/reply path, but not for `subscribe`, which is routed by the packet op
          at DmEnvRpcTransport.cpp:121 before the body is ever looked at.

      - name: payload
        type: bytes
        field_number: 2
        status: ok
        doc: "The msgpack request or reply body, byte-identical to what the ZMQ face carries."
        emit: {ue: "DmEnvRpcClientTransports.cpp:138", py: "grpc.py:226; owner_server.py:166"}
        parse: {ue: "DmEnvRpcTransport.cpp:185-192 (request), :172-176 (reply)", py: "owner_server.py:112-116; grpc.py:246-260"}

      - name: sequence_id
        type: int64
        field_number: 3
        status: drift
        doc: "Correlation id for matching a reply to its request on a shared stream."
        emit: {ue: "DmEnvRpcClientTransports.cpp (++Chan->Seq per RPC)", py: "grpc.py:223-226 (monotonic per RPC)"}
        parse: {ue: "not checked — DmEnvRpcClientTransports.cpp:163-176 reads the reply's payload and never compares op or seq", py: "grpc.py:250-256 — a mismatched non-zero seq raises _StreamBroken"}
        drift:
          what: >
            Only one of the four endpoints enforces this field. The Python client
            validates that the echoed sequence_id matches its request and tears the
            stream down otherwise; the UE client never looks at it, which is survivable
            only because the UE client opens a fresh stream per RPC and so can never
            receive a stale reply. The UE subscriber hardcodes 1, so every frame on a UE
            subscription carries sequence_id 1 and the field conveys nothing there. Both
            servers echo whatever they were sent.
          ue: "DmEnvRpcClientTransports.cpp:139,163-176,302"
          py: "grpc.py:250-256"
          resolution: P10_grpc_envelope

      - name: status
        type: google.rpc.Status
        field_number: 4
        status: dead
        doc: "Declared for reporting an error that occurred during remote dispatch."
        emit: {ue: null, py: null}
        parse: {ue: null, py: null}
        note: >
          Dead on all four endpoints — neither server sets it and neither client reads
          it, verified by grep over the transport sources. Errors travel inside the
          msgpack payload instead, in the three incompatible envelopes recorded under the
          `error_code` enum, so the one typed error channel this protocol offers is the
          one nobody uses.
        resolution: P1_one_error_envelope

  native_operations:
    doc: >
      The dm_env_rpc operations the protocol exists for. Both sides carry the full
      generated service and neither implements it.
    status: dead
    ue:
      where: "URLabDmEnvRpc/Private/Transport/DmEnvRpcTransport.cpp:220-242"
      behaviour: >
        join_world returns a response whose specs are merely instantiated and left empty
        (:223-224); reset (:226-229) and step (:230-233) return the bare empty response
        message; leave_world likewise (:234-237). create_world has no branch at all, so
        it falls through to the unconditional Stream->Write(Response) at :239 and the
        caller receives a response with no field set. An empty step reply is
        indistinguishable from a successful one.
      note: >
        The audit's A.9 lists create_world/join_world/step/reset as the four stubbed
        operations. The four branches that exist are join_world, reset, step and
        leave_world; create_world is not handled and returns an entirely empty response.
    py:
      where: "src/urlab_client/owner_server.py:68-73"
      behaviour: >
        The servicer's loop does `continue` on any request without an extension, and
        again on any extension that does not unpack to a UrlabPacket. Because Process is
        a generator, continuing yields nothing: a native create_world, join_world, step
        or reset gets NO reply at all and the caller blocks until its own deadline.
    drift:
      what: "Same request, two different failure modes: UE answers with an empty message, Python answers with silence. A dm_env_rpc-conformant client cannot work against either, and cannot even detect which one it reached in the same way."
      resolution: P10_grpc_envelope

  stream_lifecycle:
    py_client:
      where: "src/urlab_client/transports/grpc.py:164-175, RPC path :218-260"
      behaviour: "One long-lived bidirectional stream, fed by a queue and serialised by a lock. No gRPC deadline on the call; the per-RPC timeout is enforced by submitting next() to an executor (:235-237). A broken stream raises _StreamBroken and is reconnected."
    ue_client:
      where: "URLabDmEnvRpc/Private/Transport/DmEnvRpcClientTransports.cpp:120-176"
      behaviour: "A FRESH stream per RPC: Stub->Process with a new ClientContext, one Write, WritesDone, one Read, Finish. The deadline is the caller's timeout. The reply's op and sequence_id are never checked."
    status: drift
    drift:
      what: >
        One side holds a stream open for the life of the session, the other builds and
        tears one down per request. The per-RPC stream makes the UE client's missing
        sequence-id check harmless and makes its connection cost per call; the
        long-lived stream makes the Python client's sequence-id check necessary and makes
        it vulnerable to the keepalive problem below. Neither behaviour is written down
        anywhere the other side can see.
      ue: "DmEnvRpcClientTransports.cpp:143-162"
      py: "grpc.py:164-175"
      resolution: P10_grpc_envelope

  keepalive:
    status: drift
    drift:
      what: >
        The Python client sets aggressive channel keepalives — 20 s ping interval, 10 s
        timeout, pings permitted with no active calls, and max_pings_without_data 0 —
        while both servers run gRPC-core defaults, which allow far fewer. An idle Python
        client accrues ping strikes and the server eventually sends GOAWAY too_many_pings,
        which surfaces as a periodic _StreamBroken and a silent reconnect. The UE client
        sets no keepalive at all and never sees this, because its streams do not live
        long enough to be idle.
      ue: "no keepalive channel args on either the UE client or the UE server"
      py: "src/urlab_client/transports/grpc.py:135-145"
      resolution: P10_grpc_envelope

  codegen:
    regen_script:
      ue: "none — GenProto is checked in; docs/grpc_dmenv_setup.md:49-50 states no protoc run is needed to build"
      py: "none — src/urlab_client/transports/_dmenv/__init__.py:3-5 gives the protoc command in a docstring, and grpcio-tools is not a dependency in any extra"
      status: drift
      drift:
        what: "Two independently vendored copies of one pair of .proto files, with no script on either side that regenerates them and no test that compares the descriptors or decodes the other side's packets. The only thing keeping them in step is that a human ran protoc twice."
        resolution: P10_grpc_envelope
    generator_versions:
      ue: "protobuf C++ 4.25.1 (URLabDmEnvRpc/Private/GenProto/urlab_dm_env_rpc.pb.h:3), gRPC v1.62.0 (third_party/grpc/build.sh:19-20)"
      py: "protobuf Python gencode 7.35.1 (transports/_dmenv/urlab_dm_env_rpc_pb2.py:5), grpcio-tools 1.83.0 (transports/_dmenv/dm_env_rpc_pb2_grpc.py:8)"
      status: drift
      drift:
        what: >
          The two vendored stubs were generated years apart in toolchain terms. The
          Python gencode calls _runtime_version.ValidateProtobufRuntimeVersion at import
          (urlab_dm_env_rpc_pb2.py:12) and the gRPC stub hard-fails when the installed
          grpcio is older than 1.83.0 (dm_env_rpc_pb2_grpc.py:8-24), yet pyproject.toml's
          `grpc` extra pins only grpcio>=1.62.0 and protobuf>=4.25.0 (pyproject.toml:33-37)
          — the declared floor is below what the checked-in stubs will accept, so a fresh
          install that resolves to the stated minimum cannot import the transport at all.
        ue: "GenProto/urlab_dm_env_rpc.pb.h:3; third_party/grpc/build.sh:19-20"
        py: "pyproject.toml:33-37 vs transports/_dmenv/dm_env_rpc_pb2_grpc.py:8-24"
        resolution: P10_grpc_envelope
    double_registration:
      what: >
        grpc.py:68-75 prefers a pip-installed dm_env_rpc.v1 for the dm_env modules and
        falls back to the vendored ones, while owner_server.py:50-55 always imports the
        vendored ones. A process that runs both a client and an owner with pip's
        dm_env_rpc installed registers the dm_env_rpc.v1 package twice in the descriptor
        pool.
      ue: null
      py: "src/urlab_client/transports/grpc.py:68-75 vs src/urlab_client/owner_server.py:48-55"
      resolution: P10_grpc_envelope

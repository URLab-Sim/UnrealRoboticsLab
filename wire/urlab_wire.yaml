messages:

  subscribe:
    doc: >
      A description of the ZMQ render-bus prefix subscription. This is not a URLab command:
      the SUBSCRIPTION ITSELF is the request, and the topic spells the requested tier.
      gRPC viewer subscription was removed; gRPC remains a render request/reply adapter.
    op: null
    generated: false
    status: deleted
    faces:
      grpc: null
      zmq:
        kind: prefix_filter
        doc: >
          zmq_setsockopt(ZMQ_SUBSCRIBE, topic) where the TOPIC carries the request: `render`
          for the lean tier, or the tiered spelling for a negotiated one. The publisher is
          XPUB, so it is handed the subscribe and the unsubscribe -- including the one libzmq
          synthesises when a peer vanishes -- which gives this face the same per-subscription,
          explicitly-released negotiation gRPC has, with no second socket and no new op. The
          `subscribe_ok` reply below is what the control REP face returns to a peer that asks
          for the topic by name rather than deriving it.
        ue: "Private/Transport/ZmqClientSubscribeTransport.cpp (SetRenderDebugCaps subscribes the tiered topic); grammar in Private/Transport/RenderBusTopics.cpp"
        py: "src/urlab_client/owner_faces.py (topic_for_caps_key / caps_from_topic)"
      shm: null
    direction: subscriber_to_owner
    fields:
      - name: op
        type: string
        value: subscribe
        required: true
        status: ok
        doc: "Carried on the UrlabPacket envelope, not inside the msgpack payload."
        emit: {ue: "DmEnvRpcClientTransports.cpp:300", py: "tests only"}
        parse: {ue: "DmEnvRpcTransport.cpp:121", py: "owner_server.py:75"}

      - name: format
        type: string
        value: render
        required: true
        status: dead
        doc: "Names the tier being subscribed to. There has only ever been one tier."
        emit: {ue: "DmEnvRpcClientTransports.cpp:268", py: "tests only"}
        parse: {ue: null, py: null}
        drift:
          what: >
            Neither server reads this key. The UE server never touches the payload except to
            forward the whole thing to the debug-caps parser, and the Python server unpacks
            the payload and passes it to parse_render_debug_caps, which looks only at
            contacts, overlay and maxcontacts. The comment block that documents the format
            token sits next to code that ignores it, and every Python subscribe test pins the
            value, so the field is load-bearing in the test suite and dead on the wire.
          ue: "DmEnvRpcTransport.cpp:121-158 (payload forwarded whole, never inspected for format)"
          py: "owner_server.py:83-84 (comment), render_owner.py:650-665 (parser reads three keys, none of them format)"
          resolution: P12_no_silent_tolerance

      - name: contacts
        type: bool
        optional: true
        default: false
        status: drift
        doc: "Asks the owner to append the contact list to this subscription's frames."
        emit: {ue: "DmEnvRpcClientTransports.cpp:276-278 (key written only when true)", py: null}
        parse: {ue: "Private/MuJoCo/Core/AMjManager.cpp:693 (TryGetBoolField, strict)", py: "src/urlab_client/render_owner.py:662 (bool(), coercing)"}
        drift:
          what: >
            UE's TryGetBoolField accepts only a real boolean and leaves the cap off for
            anything else; Python's bool() coerces, so a subscriber sending contacts as 1 or
            as a non-empty string turns the tier on against a Python owner and not against a
            UE owner. The same coercion difference applies to overlay.
          ue: "AMjManager.cpp:693"
          py: "render_owner.py:662"
          resolution: P12_no_silent_tolerance

      - name: overlay
        type: bool
        optional: true
        default: false
        status: drift
        doc: "Asks for the derived-decor bundle: xfrc_applied, subtree_com, ctrl, act, tendon wraps, sensordata."
        emit: {ue: "DmEnvRpcClientTransports.cpp:280-282 (only when true)", py: null}
        parse: {ue: "AMjManager.cpp:694 (strict)", py: "render_owner.py:663 (coercing)"}
        drift: {what: "Same strict-versus-coercing split described under contacts.", ue: "AMjManager.cpp:694", py: "render_owner.py:663", resolution: P12_no_silent_tolerance}

      - name: maxcontacts
        type: int
        alias: max_contacts
        optional: true
        default: 0
        status: drift
        doc: "Cap on the number of contacts serialised per frame."
        emit: {ue: "DmEnvRpcClientTransports.cpp:284-286 (written only when > 0, so 0 never reaches the wire from a UE subscriber)", py: null}
        parse: {ue: "AMjManager.cpp:696-699 (maxcontacts then max_contacts, clamped at 0)", py: "render_owner.py:658 (same alias order), :664 (clamped at 0)"}
        drift:
          - what: >
              The two sides disagree about what 0 means and UE disagrees with itself. The
              subscriber-side struct comment calls 0 uncapped; the owner-side struct comment
              calls 0 none. The aggregation then makes it moot in the worst way: UE folds
              every subscriber's cap together with FMath::Max, so a request for 0 loses to
              any positive cap from any other subscriber, while Python's aggregation lets 0
              win. The identical request produces opposite contact counts depending on which
              owner answered it.
            ue: "Public/Transport/ClientSubscribeTransport.h:29 (0 = uncapped) vs Public/MuJoCo/Core/AMjManager.h:453 (0 => none); aggregation AMjManager.cpp:718"
            py: "render_owner.py:573-587"
            resolution: P12_no_silent_tolerance
          - what: >
              UE unions the parsed caps into one process-global ActiveRenderDebugCaps and
              never clears them, so a subscription is not a subscription-scoped negotiation
              at all: one debug subscriber raises the tier for every other consumer of that
              owner, including ZMQ subscribers that never asked and have no way to ask. Python
              registers and unregisters per stream.
            ue: "AMjManager.cpp:703-720 (the comment at :709-712 states the union is deliberate)"
            py: "owner_server.py:102-107 (register/unregister around the stream)"
            resolution: P12_no_silent_tolerance

      - name: sequence_id
        type: int64
        required: true
        status: drift
        doc: "Envelope field, echoed onto every frame of the stream."
        emit: {ue: "DmEnvRpcClientTransports.cpp:302 (hardcoded constant 1)", py: "tests use 1"}
        parse: {ue: "DmEnvRpcTransport.cpp:158, echoed at :168", py: "owner_server.py:105, echoed at :160"}
        drift:
          what: >
            Both servers faithfully echo the value onto every outgoing frame and no
            subscriber ever validates it. The UE subscriber hardcodes 1 and reconnects with 1
            forever, so it cannot distinguish frames from the stream it just opened from
            frames from the stream it lost, which matters because the reconnect loop is
            silent.
          ue: "DmEnvRpcClientTransports.cpp:302, :310-320"
          py: "owner_server.py:160"
          resolution: P1_one_error_envelope
    reply_fields_at: reply.fields
    reply:
      doc: >
        `subscribe_ok`. Whether it reaches the wire is the one thing a face still decides:
        REQ/REP owes exactly one reply per request, so the ZMQ face sends it and it is what
        carries the negotiated topic; on gRPC the acknowledgement is the first streamed
        frame, so the ack is consumed internally rather than emitted -- putting a non-frame
        packet into a stream the Unreal subscriber reads as frames would break the reader.
        A successful gRPC subscribe is therefore still the arrival of the first view_frame.
      fields:
        - name: op
          type: string
          value: subscribe_ok
          status: ok
          emit: {ue: null, py: "render_owner.py — subscribe reply"}
          parse: {ue: null, py: "owner_faces.py"}

        - name: format
          type: string
          value: render
          status: dead
          doc: "Echo of the requested tier name. There has only ever been one tier."
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: null}

        - name: sub
          type: int
          status: ok
          doc: >
            The open subscription's handle, or -1 when the topic IS the subscription. A
            publish/subscribe bus has no back-channel to hold a handle on, so on ZMQ the act
            of subscribing to the topic opens the tier and there is nothing to release by
            id; -1 says exactly that, rather than leaving the peer to infer it from the face.
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: "owner_faces.py"}

        - name: bus
          type: string
          format: uri
          status: ok
          doc: "The bus this subscription's frames travel on, per face."
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: null}

        - name: topic
          type: string
          status: ok
          doc: >
            Where the frames for THESE capabilities land; see `render_bus_topics`. Empty on
            a stream face, whose frames need no topic at all.
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: "owner_faces.py"}

        - name: contacts
          type: bool
          status: ok
          doc: "Echo of what was GRANTED, not of what was asked for, so a peer learns the tier it got."
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: null}

        - name: overlay
          type: bool
          status: ok
          doc: "As `contacts`."
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: null}

        - name: maxcontacts
          type: int
          status: ok
          doc: "The granted contact cap. Pinned to 0 when contacts are off, matching the topic grammar."
          emit: {ue: null, py: "render_owner.py"}
          parse: {ue: null, py: null}

        - name: view_frame
          type: msgpack
          payload: "message render_frame"
          location: "grpc stream, not the subscribe_ok map"
          status: ok
          emit: {ue: "DmEnvRpcTransport.cpp:167-171", py: "owner_server.py:160-161"}
          parse: {ue: "DmEnvRpcClientTransports.cpp:310-322", py: "tests only"}
          note: "Python dedups on the frame's own `f` field; UE dedups on an internal transport sequence via GetRenderFrame(Frame, LastSeq)."
      refusal:
        status: drift
        doc: "The Python owner refuses a subscribe when the camera_rpc grant is off; the UE owner has no gate."
        emit: {ue: null, py: "owner_server.py:78-81 ({ok:false, error:'capability disabled: camera_rpc'}, then the stream ends)"}
        parse: {ue: null, py: null}
        drift:
          what: >
            The refusal packet is unreadable by the only subscriber that exists. The UE
            subscriber's read loop discards every packet whose op is not view_frame, without a
            log, then falls out of the loop, sleeps 0.3 seconds and reconnects, forever. A
            capability-refused subscriber is indistinguishable from an owner that has not
            started yet. On the other side the UE server has no capability gate on subscribe
            at all, so a subscriber that is refused by a Python owner is accepted unconditionally
            by a UE one.
          ue: "DmEnvRpcClientTransports.cpp:316-319 (silent discard), :344 (backoff); DmEnvRpcTransport.cpp:121-183 (no gate)"
          py: "owner_server.py:78-81"
          resolution: P1_one_error_envelope
    drift:
      - what: >
          The negotiation itself is asymmetric across transports rather than across sides.
          A gRPC subscriber can ask for the debug tier and a ZMQ subscriber cannot, even though both
          receive the identical render_frame payload from the identical publisher. On a UE
          owner the gRPC request then leaks onto the ZMQ face anyway through the global caps
          union, so ZMQ subscribers receive a tier they could not request and cannot decline.
        ue: "ZmqClientSubscribeTransport.cpp:89; ClientSubscribeTransport.cpp:42; AMjManager.cpp:703-720"
        py: "render_owner.py:813-814 (ZMQ publish never carries per-subscription caps)"
        resolution: P1_one_error_envelope
      - what: >
          The caps struct is defined twice inside UE with different member names, once on the
          subscriber side and once on the owner side, and the two are bridged by hand in the
          parser rather than by a shared type.
        ue: "Public/Transport/ClientSubscribeTransport.h:26-33 (bContacts/bOverlay/MaxContacts) vs Public/MuJoCo/Core/AMjManager.h:449-454 (bStreamContacts/bStreamOverlay/MaxContacts)"
        resolution: P12_no_silent_tolerance
    note: >
      The gRPC transport sources live in the URLabDmEnvRpc module, not URLab, so paths
      beginning Private/Transport/DmEnvRpc* resolve under Source/URLabDmEnvRpc/.

  camera_frame_egress:
    doc: >
      Camera pixels leave the engine by three different paths that share nothing but the
      pixel format. Two of them are push streams that prefix every buffer with the
      camera_frame_meta binary struct; the third is a pull path that carries the same
      numbers as msgpack keys inside a step reply and drops one of them. Nothing generates
      the three encoders from one description, and the two push paths disagree about how a
      camera's stream is even named.
    op: null
    faces:
      zmq:
        kind: pub_sub
        topic: "the camera's canonical name, `<articulation>/<part>`"
        ue: "Private/Transport/ZmqCameraPublishTransport.cpp:224-231"
        py: "src/urlab_client/transports/zmq.py:314 (SUBSCRIBE), :316-317 (recv topic frame, discard; recv payload)"
      shm:
        kind: ring
        ue: "Private/Transport/ShmCameraPublishTransport.cpp:54-68"
        py: "src/urlab_client/transports/shm.py:487-547"
      sync_in_reply:
        kind: req_rep
        op: step
        ue: "Private/Bridge/RpcHandlers_Step.cpp:245-300 (request parse), :409-411 (reply attach), Private/Bridge/RpcHandlers_Camera.cpp:475-560 (encoder)"
        py: "src/urlab_client/client.py:1228-1229,1298-1299 (request), :2157-2210 (decode)"
    direction: owner_to_consumer
    binary_header:
      struct: camera_frame_meta
      applies_to: [zmq, shm]
      doc: "See binary_structs.camera_frame_meta. Byte-exact on both sides; the drift below is entirely about what the readers do with it, not its layout."
      slot_layout: "SHM slot is [u32 size][40 B camera_frame_meta][pixels]; ZMQ sends [topic frame][40 B camera_frame_meta ++ pixels]."
    fields:
      - name: pixels
        type: bytes
        status: drift
        doc: >
          Four-byte BGRA for colour, semantic and instance modes; float32 for depth. The
          format is never on the stream, only in the sync reply's dtype, so a stream reader
          must already know the mode from the handshake.
        emit: {ue: "ZmqCameraPublishTransport.cpp:225-226 (meta then pixels into one payload); ShmCameraPublishTransport.cpp:66-68 (into the ring)", py: null}
        parse: {ue: null, py: "src/urlab_client/transports/__init__.py:99-110 (split), client.py:1547-1561 (stream decode), client.py:2189-2203 (sync decode), render_client.py:79-83 (fast-path decode)"}
        drift:
          what: >
            Three decoders, three answers about channel order. The streaming decoder
            reindexes BGRA to RGBA for REAL-mode cameras and leaves segmentation modes as
            BGRA. The sync-reply decoder does the same reindex, keyed on the same mode, but
            reads the payload's own width and height instead of the view's and ignores the
            dtype the server sent it, discriminating depth from colour by the camera mode
            it has cached. The fast-path decoder does no reindex at all and hands back raw
            BGRA with a docstring that says so. The same camera through the subscriber path and
            through the render-client path therefore returns arrays with swapped red and
            blue channels, and neither array is labelled.
          py: "client.py:1554-1560 (RGBA for REAL) vs client.py:2197-2203 (RGBA for REAL, dtype ignored) vs render_client.py:79-83 (raw BGRA)"
          ue: "ZmqCameraPublishTransport.cpp:225-226 emits BGRA unconditionally"
          resolution: P12_no_silent_tolerance

      - name: [width, height]
        type: u32
        unit: pixel
        applies_to: [zmq, shm]
        status: drift
        doc: "Present in every stream header. See binary_structs.camera_frame_meta."
        emit: {ue: "Public/MuJoCo/Capture/MjCameraTypes.h:77-92 filled per frame", py: null}
        parse: {ue: null, py: "transports/__init__.py:100 (unpacked into _w and _h and then discarded), :104 (unpacked into _w2 and _h2 and discarded)"}
        drift:
          what: >
            Python names both header dimensions with a leading underscore and never uses
            them. Every stream decode sizes the array from the resolution learned in the
            handshake instead, so a camera whose resolution changed after the handshake
            fails the size check and the frame is dropped rather than reshaped from the
            authoritative numbers that were sitting in the header. The sync-reply decoder
            does the opposite and deliberately prefers the payload's dimensions over the
            registered ones, with a comment explaining why.
          py: "transports/__init__.py:100,104 and client.py:1547 (handshake resolution) vs client.py:2189-2190 (payload dimensions preferred)"
          resolution: P12_no_silent_tolerance

      - name: capture_unix_time
        type: f64
        unit: second
        applies_to: [zmq, shm]
        status: drift
        doc: "Wall-clock seconds at capture. Carried by both stream paths."
        emit: {ue: "MjCameraTypes.h:77-92 (v2 header)", py: null}
        parse: {ue: null, py: "transports/__init__.py:104-107 (returned as the fourth element; None on a v1 header)"}
        drift:
          what: >
            The sync-in-reply path has no equivalent key. The step reply's per-camera object
            carries width, height, frame_id, sim_time, dtype and data and stops there, so a
            client that pulls frames synchronously can never recover the wall-clock capture
            instant that the same camera puts on its stream. Nothing marks the field as
            stream-only; it is simply missing.
          ue: "RpcHandlers_Camera.cpp:531-534 (the four numbers written) versus MjCameraTypes.h:77-92 (seven header fields)"
          py: "client.py:2157-2210 never looks for it"
          resolution: P5_frame_timestamp

      - name: zmq_topic
        type: string
        applies_to: [zmq]
        status: drift
        doc: "Advertised per camera in the session hello's camera_topics block, as the canonical name."
        emit: {ue: "Private/Bridge/RpcDispatcher.cpp:1082 (zmq_topic = canonical name), :1083 (the same string is the map key); frame topic ZmqCameraPublishTransport.cpp:229"}
        parse: {ue: null, py: "src/urlab_client/articulation.py:801-804 (camera_topics into URLabCameraView), client.py:1351-1357 (topic handed to start_camera_stream)"}
        drift:
          what: >
            UE sends the topic frame as the topic string with a single trailing space
            appended, and Python subscribes to the string without it. ZMQ subscriptions are
            prefix matches, so this works and has always worked. It is recorded because the
            trailing space is invisible in every log and because any future move to exact
            topic matching, or to a topic that is a prefix of another topic, breaks silently.
          ue: "ZmqCameraPublishTransport.cpp:228-229 (Topic + TEXT(\" \"))"
          py: "transports/zmq.py:314 (SUBSCRIBE with the bare topic)"
          resolution: P4_one_handshake_shape

      - name: shm_file_name
        type: string
        applies_to: [shm]
        status: ok
        doc: >
          The name of the per-camera ring file inside the session directory. It is not on
          the wire at all: both sides derive it independently from the camera name.
        emit: {ue: "Private/Bridge/RpcDispatcher.cpp:1167-1172"}
        parse: {py: "src/urlab_client/articulation.py:216-241 -> client.py:1366-1374 -> transports/shm.py:487-521"}
        derivation:
          ue: "Private/Transport/ShmCameraPublishTransport.cpp:59-64 — splits the canonical name on '/' and formats cam_<articulation>_<part>.shm"
          py: "src/urlab_client/transports/shm.py:498 — formats cam_{prefix}_{name}.shm with name left as the full canonical key"
        drift:
          what: >
            The two derivations do not agree and the SHM camera path therefore cannot open.
            UE splits the canonical name on the slash and writes cam_arm0_wrist.shm. Python
            passes the canonical name through whole, so it builds a path containing an
            embedded slash, which resolves to a file inside a directory that does not exist.
            The open never succeeds, the wait loop runs out its open_timeout_s, and the
            transport falls back to ZMQ at debug log level, so the only visible symptom is
            that SHM cameras are quietly never faster than ZMQ ones. The session hello
            advertises zmq_endpoint and zmq_topic per camera but no SHM name, which is what
            forces the double derivation in the first place.
          ue: "ShmCameraPublishTransport.cpp:59-64"
          py: "shm.py:498, fallback at shm.py:531-547; canonical key reaches it via client.py:1355-1357 <- articulation.py:801-804 <- RpcDispatcher.cpp:1083"
          resolution: P4_one_handshake_shape
        note: >
          The Python SHM camera test cannot catch this. It writes its fixture file as the
          bare name cam_arm0_wrist.shm and calls start_camera_stream with a bare part name,
          so the two derivations coincide inside the test and diverge only against a real
          handshake (tests/test_shm_transport.py:409, :454).
        resolution: RESOLVED    # blocker 8: the server names the segment, neither side derives it

      - name: "sync reply cameras{}"
        type: map<string, object>
        applies_to: [sync_in_reply]
        status: drift
        doc: >
          The pull path's per-camera object: width, height, frame_id, sim_time, dtype, data,
          keyed by canonical camera name with no name field inside the object.
        emit: {ue: "RpcHandlers_Camera.cpp:531-559; attached to the reply at RpcHandlers_Step.cpp:409-411 only when non-empty", py: null}
        parse: {ue: null, py: "client.py:2157-2159 (iterates .items()), :2163-2170 (accepts msgpack bin or a base64 string), :2189-2203"}
        drift:
          what: >
            This is the second encoder for the payload that render_frame already encodes,
            and the two disagree on shape and on failure. Here the container is a map keyed
            by name, the entries carry no name, and a camera whose frame is not ready is
            omitted from the map entirely. There the container is an array, the entries carry
            a name, and a camera whose frame is not ready still gets a name-only entry that
            crashes the reader. Neither encoder ships capture_unix_time.
          ue: "RpcHandlers_Camera.cpp:521-528 (omit when not ready), :559 (map key) versus RpcHandlers_Render.cpp:451-475,498 (array with stub entries)"
          py: "client.py:2158 versus render_client.py:357"
          resolution: P2_binary_under_bare_keys

      - name: "sync reply dtype"
        type: string
        values: [bgra8, float32]
        applies_to: [sync_in_reply]
        status: drift
        doc: "The only place a pixel format appears on this wire at all."
        emit: {ue: "RpcHandlers_Camera.cpp:540 (float32 for Depth mode), :554 (bgra8 for Real, SemSeg and InstanceSeg)", py: null}
        parse: {ue: null, py: "client.py:2192-2203 does not read it"}
        drift:
          what: >
            The sync decoder ignores the dtype the server took the trouble to send and
            decides between float32 and uint8 from the locally cached camera mode instead.
            A camera whose mode changed server-side, or one the client mis-registered, is
            decoded with the wrong element size and either raises a size mismatch or, when
            the byte counts happen to line up, silently produces garbage.
          ue: "RpcHandlers_Camera.cpp:540,554"
          py: "client.py:2192-2197"
          resolution: P12_no_silent_tolerance
    drift:
      - what: >
          There is no reader anywhere for a v1 camera_frame_meta header and no UE emitter of
          one, but the Python parser still branches on it, and the branch is reachable by
          accident: a v2 frame truncated below 40 bytes still passes the 32-byte length test
          and the magic check, so it is parsed as v1 and eight bytes of header are handed
          back to the caller as the first eight pixels.
        py: "transports/__init__.py:99-109"
        ue: "no v1 emitter exists"
        resolution: P12_no_silent_tolerance
      - what: >
          A camera that is not found is handled differently on each of the three paths. The
          stream paths simply never start (no topic, no file). The sync path logs the drop
          and omits the camera. The render_frame path drops the name with no log at all.
        ue: "RpcHandlers_Camera.cpp:502 (logged drop) versus MjRenderer.cpp:1793-1818 (silent drop)"
        py: "client.py:2185-2187 (unknown camera logged at debug and skipped)"
        resolution: P12_no_silent_tolerance


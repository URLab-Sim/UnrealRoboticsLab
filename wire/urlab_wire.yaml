  network_descriptor:
    fields: {transfer: {type: literal, value: network}, blob_id: {type: nonempty_string}, boot_id: {type: nonempty_string}, session_id: {type: nonempty_string}, byte_length: {type: positive_int64}, sha256: {type: string}, expires_in_s: {type: finite_float}}
  shm_descriptor:
    fields: {transfer: {type: literal, value: shm}, blob_id: {type: nonempty_string}, boot_id: {type: nonempty_string}, session_id: {type: nonempty_string}, byte_length: {type: positive_int64}, sha256: {type: string}, expires_in_s: {type: finite_float}, region_id: {type: nonempty_string}, region_generation: {type: positive_int64}, object_name: {type: nonempty_string}}
  payload_descriptor:

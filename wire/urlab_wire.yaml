    fields: {committed: {type: bool}, observation: {type: simulation_observe}, status: {type: control_status}}
  simulation_step:
    fields: {committed: {type: bool}, observation: {type: simulation_observe}, status: {type: control_status}}
  simulation_reset:
    fields: {committed: {type: bool}, observation: {type: simulation_observe}, status: {type: control_status}}
  simulation_apply_state:
    fields: {committed: {type: bool}, observation: {type: simulation_observe}, status: {type: control_status}}
  simulation_forward:
    fields: {committed: {type: bool}, observation: {type: simulation_observe}, status: {type: control_status}}
  simulation_clock_stepped:
    fields: {mode: {type: literal, value: stepped}, model_generation: {type: nonnegative_int64}, time_step_s: {type: finite_float}, accumulated_debt_s: {type: finite_float}, dropped_time_s: {type: finite_float}, dropped_step_count: {type: nonnegative_int64}, max_steps_per_advance: {type: positive_int64}, max_retained_debt_s: {type: finite_float}}
  simulation_clock_freerun:
    fields: {mode: {type: literal, value: freerun}, model_generation: {type: nonnegative_int64}, time_step_s: {type: finite_float}, accumulated_debt_s: {type: finite_float}, dropped_time_s: {type: finite_float}, dropped_step_count: {type: nonnegative_int64}, max_steps_per_advance: {type: positive_int64}, max_retained_debt_s: {type: finite_float}}
  simulation_clock:
    tagged: {field: mode, variants: {stepped: simulation_clock_stepped, freerun: simulation_clock_freerun}}
  simulation_clock_status:
    tagged: {field: mode, variants: {stepped: simulation_clock_stepped, freerun: simulation_clock_freerun}}
  simulation_set_clock:

# URLab wire schema — SOURCE OF TRUTH for everything crossing the UE <-> Python boundary.
#
# STEP 02 STATE: this file records the wire EXACTLY AS IT BEHAVES TODAY, including
# every place the two sides disagree. It is a transcription, not a design. Nothing
# generates from it yet (step 03) and nothing has been unified yet (step 05).
#
# Therefore: `drift:` entries are EXPECTED and are the point. Do not "fix" them here
# ahead of step 05 — the whole value of this step is an honest baseline that the
# generated code and goldens can be diffed against.
#
# Provenance: transcribed from audit_docs/2026-09-09_pipeline_audit/audit_5_wire_contract.md,
# whose every cell carries a file:line citation into both repos at
# UnrealRoboticsLab@1c29242 / URLab_Bridge@40d2d27.
#
# Conventions for editors:
#   emit/parse   -- file:line on each side; `null` means that side has no such code.
#   drift        -- a real disagreement between the sides. Carries `resolution:` once
#                   step 05 decides; until then `resolution: P6_dead_fields_go`.
#   status       -- ok | drift | dead (emitted by someone, read by nobody) | phantom
#                   (parsed by someone, emitted by nobody)

schema_version: 1
records_repos_at:
  unreal_robotics_lab: "1c29242"
  urlab_bridge: "40d2d27"

# ---------------------------------------------------------------------------
# Conventions that hold across every message unless a field says otherwise.
# ---------------------------------------------------------------------------
conventions:
  units:
    length: metre           # UE converts to centimetres only inside the renderer
    force: newton
    torque: newton_metre
    time: second
    angle: radian
  quaternion: wxyz          # MuJoCo order, on the wire, everywhere
  matrix_order: row_major
  serialisation: msgpack
  binary_fields:
    on_the_wire: msgpack_bin
    drift:
      what: >
        UE's unpacker converts a msgpack bin map-value into a base64 STRING under
        `<key>__b64__`, and that internal representation has leaked onto the wire:
        the Python owner deliberately emits `vfs_assets` as `{name__b64__: b64str}`
        to match it, while UE itself emits `{name: bin}`. One field, two encodings.
      ue: "Private/Utils/MsgpackHelpers.cpp:295-302"
      py: "src/urlab_client/render_owner.py:306-309"
      resolution: P2_binary_under_bare_keys
  numbers:
    drift:
      what: "UE packs every number as float64; Python packs ints as ints. Frames from the two owners are never byte-identical."
      ue: "Private/Utils/MsgpackHelpers.cpp:168-171"
      resolution: P2_binary_under_bare_keys

# ---------------------------------------------------------------------------
# STEP 05 RESOLUTION POLICIES
#
# 112 drifts were recorded in step 02. Deciding each one bespoke would be 112
# chances to be inconsistent, so the divergences are resolved by TWELVE rules.
# Every `resolution:` below is either one of these policy names or a bespoke
# decision with its reasoning attached.
#
# Beta rules apply (decision D3): no aliases, no deprecation window. The losing
# spelling is deleted, not tolerated.
# ---------------------------------------------------------------------------
resolution_policies:

  P1_one_error_envelope:
    rule: >
      Exactly one error shape on every face and every transport:
      {op: "error", code: <error_code>, message: <human string>}.
      `ok: false` is deleted. A bare {"error": ...} is deleted. Every code used
      must exist in RpcErrorCodes.h; four currently do not.
    applies_to: [error replies on every op, both repos]

  P2_binary_under_bare_keys:
    rule: >
      Binary travels as msgpack bin under its own key. The `<key>__b64__`
      suffix is an artefact of Unreal's internal JSON representation and must
      never appear on the wire, in an emitter, or in a test fixture. Readers
      stop accepting the variants they grew to tolerate.
    applies_to: [vfs_assets, model bytes, assets map, camera data]

  P3_ints_as_ints:
    rule: >
      A field declared int packs as msgpack int on both sides. Unreal currently
      packs every number as float64, so frames from the two owners are never
      byte-identical and no golden can compare them.
    applies_to: [f, frame_id, dim, g1, g2, eq_active, wrap_obj, ngeom, counts]

  P4_one_handshake_shape:
    rule: >
      render_hello returns exactly:
      {op, scene, ngeom, capabilities[], features[], model_format, model(bin),
       vfs_assets{name:bin}, bus, mujoco_version}.
      Deleted: `mjb` and `xml` as separate keys (the bytes ship once, under
      `model`), `format` (duplicate of model_format), `ok` (P1 covers failure),
      `broadcasting` (read by nobody). The session hello reuses this same model
      block instead of inventing `mjcf_compiled` as a third name.
    applies_to: [render_hello, session_hello model block]

  P5_frame_timestamp:
    rule: >
      The render frame carries `t` (float seconds, the producer's d->time) and
      the consumer uses it. Both owners emit it. `sim_time` and `frame_id` stop
      being read off the bus, since no owner ever put them there — that is why
      sim-clock camera delay silently did nothing on the streaming path.
    applies_to: [render_frame]

  P6_dead_fields_go:
    rule: >
      A field emitted by someone and read by nobody is deleted from the wire,
      unless its consumer lands in the same change. Recorded as `status: dead`
      in step 02: eq_active, eq_anchor, light_xpos, light_xdir, broadcasting,
      warnings, subscribe.format, per-chunk sha256, and the contact fields
      dim/g1/g2.
    exception: >
      The overlay renderer is a real planned consumer for eq_* and light_*
      (step 09). Those four are KEPT and marked `pending_consumer` with the step
      that must land it; everything else in the list goes.

  P7_phantom_fields_go:
    rule: >
      A field parsed by someone and emitted by nobody is either emitted or the
      parser is deleted. No key may be read speculatively.
    applies_to: [render_frame.sim_time, render_frame.frame_id]

  P8_one_capability_vocabulary:
    rule: >
      One enum with three columns (wire token, CLI token, aliases). The registry
      and the handshake both emit `capabilities[]` (grants) and `features[]`
      (protocol/build features) as SEPARATE keys, so the two disjoint meanings
      stop sharing one name. Step 08 splits them further by kind; this step only
      stops them colliding.

  P9_one_registry_schema:
    rule: >
      One entry struct, written atomically on both sides, read by one reader per
      repo with one liveness rule (mtime TTL AND pid liveness, both, everywhere).
      `ngeom` carries the real value. `grpc` advertises a dialable host:port with
      a scheme, never 0.0.0.0 and never a default port the process is not
      listening on. `registry_written_at` is ISO-8601 on both sides.

  P10_grpc_envelope:
    rule: >
      UrlabPacket.op is the SOLE dispatch key; the body's duplicate `op` is
      deleted. Native dm_env_rpc operations that are not implemented return
      UNIMPLEMENTED rather than an empty response or no response at all.
      `status` is either used for P1's envelope or removed from the proto.
      Servers set keepalive permits so an idle client is not disconnected.

  P11_units_and_order_are_declared:
    rule: >
      Every numeric field states its unit and, for quaternions, wxyz. SI
      throughout on the wire; the centimetre conversion happens inside the
      renderer and never crosses. Documented once in `conventions`, not per site.

  P12_no_silent_tolerance:
    rule: >
      A parser rejects what it does not understand instead of skipping it. A
      malformed pose array, a non-string asset value or an unknown camera name
      produces an error reply, not a silently partial render.


# ---------------------------------------------------------------------------
# Enums. Wire token is authoritative; `cli` and `aliases` record the other
# spellings that exist today.
# ---------------------------------------------------------------------------
enums:

  step_mode:
    doc: "How a simulation advances its physics clock."
    status: ok      # the one genuinely clean vocabulary on this wire
    values:
      - {wire: freerun,     doc: "steps on its own clock"}
      - {wire: stepped,     doc: "steps only on a client step request"}
      # Rendering/viewing accepts qpos or Cartesian frames through separate APIs.
    emit: {ue: "Private/Bridge/RpcHandlers_Step.cpp:83-99", py: "src/urlab_client/enums.py:39-41"}
    note: "Legacy live/direct/puppet tokens are neither accepted nor emitted."

  workflow:
    doc: "Canonical process workflow selected at boot."
    values:
      - {wire: simulation, doc: "manager-free simulation service"}
      - {wire: render, doc: "manager-free request-driven render service"}
      - {wire: viewer, doc: "manager-free passive viewer service"}
    emit: {ue: "Private/MuJoCo/Render/MjLauncherFlags.cpp", py: null}

  drive:
    doc: >
      Where a renderer instance's pose comes from. Boot-time, one value per
      instance, and every value is a genuine producer: there is no longer a
      value meaning "nothing yet", because "no model has arrived" is a
      lifecycle state and modelling it as a pose source is what let an instance
      sit in it forever producing nothing.
    values:
      - {wire: sim,       cli: sim,                  doc: "this instance owns physics in the shared engine and draws its stepped state"}
      - {wire: subscribe, cli: "subscribe:<endpoint>", doc: "this instance subscribes to a producer's pose broadcast and mirrors it"}
      - {wire: request,   cli: request,              doc: "this instance's pose arrives with each render request; the request IS the frame"}
    emit: {ue: "Public/MuJoCo/Render/MjRendererBoot.h", py: null}
    note: >
      Named from THIS instance's side throughout, which the earlier
      sim/stream/push triple was not: `push` described what the sender did.
      Not a wire value yet -- CLI only.

  capability:
    doc: >
      Resolved. There is one capability vocabulary now and it lives in
      `capability_model` below, split by the direction it points. The six
      disagreeing definition sites this entry used to record are gone: the CLI
      tokens, the advertised grants and the C++ enum are all the one list, and
      the two vocabularies that were never capabilities at all -- build
      features and subscription options -- are recorded separately under their
      own names.
    status: ok
    see: capability_model
    still_separate:
      features: "build/protocol facts nobody grants; `features_are_not_capabilities` below"
      subscription_options: "negotiated per subscription, not per process; see below"
      role: "`render_owner` is a ROLE marker in the registry entry, not a grant"

  model_format:
    doc: "How a model is carried. All three normalise to an mjModel on the receiver."
    values:
      - {wire: mjb, doc: "compiled; fastest; VERSION-LOCKED to the receiver's libmujoco"}
      - {wire: xml, doc: "MJCF text plus vfs_assets; compiled in-engine; version-independent"}
      - {wire: mjz, doc: "archive with root model.xml; decoded then compiled in-engine"}
    emit: {ue: "Private/MuJoCo/Entity/MjModelSource.cpp:140-152", py: "src/urlab_client/render_client.py:231"}

  simulation_control_source_kind:
    doc: "Reader-safe origin of the current simulation control claim; `none` is emitted when no claim exists."
    values:
      - {wire: none}
      - {wire: local}
      - {wire: remote}

  render_segmentation_object_kind:
    doc: >
      Neutral renderer identity stored in the second int32LE lane of every
      segmentation pixel. Background is (-1,-1). Instance ids index the neutral
      scene geoms array; semantic ids are Geom.BodyIndex values into bodies.
    values:
      - {wire: geometry, value: 1, doc: "second lane for instance pixels"}
      - {wire: body, value: 2, doc: "second lane for semantic pixels"}

  capture_mode:
    doc: >
      What a camera captures for one render request. The SAME four tokens the
      per-camera `mode` field in the session handshake already reports
      (RpcDispatcher.cpp), so one vocabulary describes a camera's mode wherever
      it appears, and a 1:1 mirror of `EMjCameraMode` in
      Public/MuJoCo/Capture/MjCameraTypes.h.

      All four modes are served by the typed render capture path. Ask the
      connected instance for its advertised modes; that remains the truthful
      runtime capability answer.
    values:
      - {wire: real,     ue: "EMjCameraMode::Real",  dtype: bgra8, channels: 4, doc: "tone-mapped LDR colour. The default and what a camera is built in."}
      - {wire: depth,    ue: "EMjCameraMode::Depth", dtype: float32, channels: 1, doc: "float32LE axial view depth in metres; see depth_units."}
      - {wire: semantic, ue: "EMjCameraMode::SemanticSegmentation", dtype: int32, channels: 2, served: true, doc: "(id,kind), with id the neutral body index and kind Body=2. See segmentation_contract."}
      - {wire: instance, ue: "EMjCameraMode::InstanceSegmentation", dtype: int32, channels: 2, served: true, doc: "(id,kind), with id the neutral geometry index and kind Geometry=1. See segmentation_contract."}
    depth_units:
      wire: metre
      doc: >
        float32 little-endian axial view depth in metres. The adapter converts
        Unreal centimetres at materialization, clamps finite samples to the
        effective near/far range, uses effective far as the background sentinel,
        and fails materialization for invalid non-finite or negative samples.
    segmentation_contract:
      applies_to: [semantic, instance]
      status: proven
      shape: "HxWx2 int32LE, (id, kind) per pixel, row-major"
      background: "(-1, -1)"
      doc: >
        The public identity is renderer-neutral. Instance pixels use the
        zero-based neutral scene geometry-array index and Geometry kind 1.
        Semantic pixels use Geom.BodyIndex into the neutral bodies array and
        Body kind 2. A MuJoCo facade may translate these neutral indices to its
        own object vocabulary at that boundary.
      objtype_is_constant: >
        Every foreground pixel of one mode carries its fixed kind in the second
        lane; background remains (-1,-1).
      how_the_id_survives_the_renderer: >
        A rasteriser has no integer channel, so the id travels as colour and the
        encoding is chosen so that nothing can round it. Each geom gets an unlit
        sibling mesh whose emissive is the id; unlit means the value is written
        into scene colour in the base pass with no lighting applied, and the
        capture reads `SCS_SceneColorHDR`, which is the last point before tone
        mapping. Scene colour is PF_FloatRGBA -- HALF precision, exact for
        integers only to 2048 -- so the id is split into three BYTE lanes
        (`r + g*256 + b*65536`, MuJoCo's own OpenGL encoding), each exactly
        representable, together carrying 24 bits. Zero is reserved for the
        background, so what is written is `id + 1`.

        Every renderer feature that blends or brightens is turned off for these
        captures (ApplySegmentationShowFlags): a blended edge between geom 3 and
        geom 7 would decode to geom 5 with total confidence, and any added light
        pushes a lane out of 0..255, where the decoder reports background rather
        than guess. See Public/MuJoCo/Render/MjSegId.h.
      not_covered:
        - case: "Quick-Convert primitives in `semantic` only."
          why: >
            An actor promoted into the simulation owns a MuJoCo body but no
            MuJoCo geom -- its collision shape was derived from Unreal meshes,
            not authored as a `<geom>`. So it segments by body and reads as
            background in `instance`, which is the honest answer to "which geom
            is this?" when there is no geom.
      preconditions:
        - needs: "`M_MjSegId` must have cooked."
          detail: >
            The unlit id-carrier lives in /UnrealRoboticsLab/Materials, which the
            plugin's own Config/DefaultGame.ini lists under DirectoriesToAlwaysCook,
            so it is present unless a host project overrode packaging wholesale.
            When it is absent `meta` omits both segmentation tokens and
            `render_frame` refuses them (URLabContent::HasSegIdMaterial).

  pixel_dtype:
    doc: >
      How to read one pixel of a camera frame. Always sent WITH `channels`: the
      two together are the stride, and neither is one on its own now that `int32`
      serves a two-component pixel.
    values:
      - {wire: bgra8,   channels: 4, doc: "uint8 B,G,R,A -- Unreal's native FColor order, not RGB."}
      - {wire: float32, channels: 1, doc: "one float32LE axial-view-metre value per pixel."}
      - {wire: int32,   channels: 2, doc: "(objid, objtype) per pixel. Segmentation; see enums.capture_mode.segmentation_contract."}
    emit: {ue: "Private/MuJoCo/Elements/MjCamera.cpp BuildCameraWireFrame; Private/Bridge/RpcHandlers_Render.cpp HandleRenderFrame", py: null}
    parse: {ue: null, py: "render_client.py CameraFrame.to_array"}

  error_code:
    doc: "UE's declared error codes. Python owners do not use codes at all."
    status: drift
    values_ue: "Public/Bridge/RpcErrorCodes.h"
    drift:
      what: >
        Three error envelopes on one wire. UE sends {op:"error", code, message};
        the Python owner sends {"error": ...} and also {"ok": false, "error": ...}.
        `render_client._check` reads `error` then `msg` and NEVER `message`, so every
        UE error code is discarded and surfaces as a truncated repr.
      ue: "Private/Bridge/RpcDispatcher.cpp:630-636"
      py: "src/urlab_client/render_owner.py:383,396,417,419; owner_server.py:79-81,120,144; render_client.py:419-424"
      resolution: P1_one_error_envelope

# ---------------------------------------------------------------------------
# THE CAPABILITY MODEL, SPLIT BY KIND
#
# The word "capability" covered four different kinds of thing, and calling them
# all one word is why `cameras` was two booleans on two objects that could
# disagree, why a client filtering for a grant could never match an Unreal
# instance, and why a local free-fly pawn was advertised as though a peer could
# ask for it.
#
# Asking "which direction does it point?" separates them cleanly:
#
#   service     something you STAND UP so others can reach you   (inbound socket)
#   output      something you EMIT                                (outbound data)
#   permission  something you LET OTHERS DO to you                (inbound authority)
#   local       something you do for your own user                (no wire at all)
#
# Two of the five old CLI tokens were compound and have split. That was not
# tidying: `cameras` meant both "build and stream the cameras" (an output) and
# "authorise the camera RPCs" (a permission), which is exactly why it was two
# booleans, set in two functions, on two objects, that could disagree.
#
# One capability name, one CLI token, one wire token: the name IS the token
# everywhere, so a rename can only happen here.
# ---------------------------------------------------------------------------
capability_model:
  status: implemented

  kinds:
    service:
      doc: "An ingress this process stands up. Absent means nobody can reach it that way."
      enforced_by: "presence of the listener; there is nothing to gate per-request"
    output:
      doc: "Data this process emits. Absent means the stream is never produced."
      enforced_by: "the producer, at the point of production"
    permission:
      doc: "Authority this process grants its peers. Absent means the op is refused."
      enforced_by: "the dispatcher, from the op's declared requirement in `op_permissions`"
    local:
      doc: "A local convenience. Never advertised, never negotiable, touches no wire."
      enforced_by: "nothing; it is not a contract"

  capabilities:
    - name: rpc
      kind: service
      cli: rpc
      wire: rpc
      doc: >
        Stand up the bridge so clients can call ops. NOT implicit on an instance
        that boots with no model, which is the most common way to mis-launch a
        render server.

    - name: discoverable
      kind: service
      cli: discoverable
      wire: discoverable
      doc: "Write and heartbeat a registry entry so browsers, pools and farms can find this instance."
      splits_from: publish

    - name: pose_stream
      kind: output
      cli: pose_stream
      wire: pose_stream
      doc: "Broadcast the render frame so consumers can subscribe."
      splits_from: publish
      note: >
        One token used to do both this and `discoverable`, so an instance could
        not be findable without also broadcasting, or broadcast without being
        listed. Those are independent wants: a farm node should be able to be
        findable and quiet.

    - name: camera_frames
      kind: output
      cli: camera_frames
      wire: camera_frames
      doc: "Build the model's cameras and stream their frames."
      splits_from: cameras

    - name: camera_rpc
      kind: permission
      cli: camera_rpc
      wire: camera_rpc
      doc: "Allow peers to call the camera ops."
      splits_from: cameras
      note: >
        This is the two-booleans bug named honestly. One bool authorised the
        RPCs while another actually built the cameras; one CLI token set both,
        in two functions, and neither implied the other. Splitting them by kind
        means the two bools stop being able to disagree, because they stop
        being one word. The capability name, CLI token, and wire token use the
        same canonical spelling.

    - name: accept_input
      kind: permission
      cli: accept_input
      wire: accept_input
      doc: "Allow peers to push forces, wrenches and drag intent into this sim."
      negatable: true

    - name: accept_model_load
      kind: permission
      cli: accept_model_load
      wire: accept_model_load
      doc: >
        Allow peers to swap the model. Ungated before this existed, which is how
        a discovery probe could replace a running scene. Granted by default on
        an instance whose scene can only arrive over the wire, and DENIED by
        default on a `sim` instance, whose scene is the thing being simulated.
      default: >
        Granted unless the instance's DRIVE is sim. A bridge with no renderer has no
        drive and therefore nothing to protect -- an editor session with no fast-path
        scene allows the load that would create one -- so the refusal comes from the
        renderer's resolved grants, not from the presence of a manager.
        `-URLabCaps=accept_model_load` / `-accept_model_load` overrides either way.

    - name: accept_editor_commands
      kind: permission
      cli: accept_editor_commands
      wire: accept_editor_commands
      doc: "Allow mutations through the editor-only typed service; never grants runtime or viewer input."
      negatable: true

    - name: free_fly_pawn
      kind: local
      cli: free_fly_pawn
      doc: "Spawn and possess a keyboard/mouse fly-around camera. No HMD, no stereo, no wire."
      note: >
        Advertised once as though it were something a peer could ask for. It is
        a local convenience and is not advertised at all.

  # Which permission each op requires. The dispatcher enforces from this table
  # rather than from a hand-written check inside each handler, so an op cannot
  # be added without its authority being stated, and the check cannot drift
  # from the advertised grant.
  #
  # `none` is the declared default: an op absent from this table requires no
  # permission. URLab.Wire.OpPermissionCoverage counts the gated ops and fails
  # if a name here is not a registered op.
  op_permissions:
    default: none
    ops:
      render_owner_attach: camera_rpc
      render_owner_renew: camera_rpc
      render_owner_release: camera_rpc
      render_source_install: accept_model_load
      render_scene_patch: accept_model_load
      render_scene_describe: camera_rpc
      render_capture_submit: camera_rpc
      render_capture_history_query: camera_rpc
      render_capture_poll: camera_rpc
      render_capture_cancel: camera_rpc
      render_capture_release: camera_rpc
      viewer_owner_attach: accept_input
      viewer_owner_renew: accept_input
      viewer_stream_bind: accept_input
      viewer_interaction_submit: accept_input
      viewer_source_install: accept_model_load
      viewer_scene_patch: accept_model_load
      simulation_interaction_grant_issue: accept_input
      simulation_interaction_grant_revoke: accept_input
      interaction_submit: accept_input
      render_frame:       camera_rpc
      set_camera_streaming:  camera_rpc
      set_camera_delay:      camera_rpc
      render_perturb:      accept_input
      render_load:         accept_model_load
      upload_model_commit:   accept_model_load
    note: >
      `step`'s `include_cameras` block is NOT gated here. It is production, not
      authority: an instance without the `camera_frames` OUTPUT simply produces
      no frames to attach, which is the output kind doing its own enforcement.

  # Data toggles negotiated per SUBSCRIPTION, not per process. Kept separate
  # because their lifetime is the subscription's, not the instance's.
  subscription_options:
    doc: "Requested by a consumer when it subscribes; released when it disconnects."
    options:
      - {name: contacts,    wire: contacts,    doc: "append the contact list to each frame"}
      - {name: overlay,     wire: overlay,     doc: "append the derived-decor bundle"}
      - {name: maxcontacts, wire: maxcontacts, type: int, doc: "cap the contact count; 0 is uncapped and uncapped wins"}

  # Build/protocol features are NOT capabilities: nobody grants them, nobody can
  # turn them off, and a peer cannot ask for one. They answer "what does this
  # build know how to do", which is why they travel under `features[]`.
  features_are_not_capabilities:
    values: [render_sync, render_async, model_upload, content_cache]
    wire_key: features


# ---------------------------------------------------------------------------
# Fixed binary layouts. These are byte-exact matches today — the one part of the
# wire that is already correct on both sides. Recorded so a generator can emit the
# C++ static_asserts and the Python struct format from one place.
# ---------------------------------------------------------------------------
binary_structs:

  camera_frame_meta:
    doc: "Per-frame header prefixing pixels on the ZMQ camera topics and in the SHM ring."
    size_bytes: 40
    endian: little
    packing: none          # no padding; UE carries a static_assert(sizeof == 40)
    status: ok
    ue: "Public/MuJoCo/Capture/MjCameraTypes.h:77-92"
    py: "src/urlab_client/transports/__init__.py:78-83 (struct '<IIQdIId')"
    fields:
      - {name: magic,             type: u32, value: 0x314D4355, doc: "'UCM1'"}
      - {name: version,           type: u32, value: 2}
      - {name: frame_id,          type: u64}
      - {name: sim_time,          type: f64, unit: second}
      - {name: width,             type: u32, unit: pixel}
      - {name: height,            type: u32, unit: pixel}
      - {name: capture_unix_time, type: f64, unit: second}
    notes:
      - "v1 (32 bytes) exists ONLY as a Python parse branch; no UE emitter. A runt v2 frame under 40 bytes falls into it and leaks 8 header bytes into the pixels (transports/__init__.py:103-109)."
      - "Slot layout is [u32 size][40 B meta][pixels]."

  shm_ring_header:
    doc: "Header of a shared-memory ring region."
    size_bytes: 64
    endian: little
    status: ok
    ue: "Public/Transport/ShmRegion.h:57-67"
    py: "src/urlab_client/transports/shm.py:124-134"

# ---------------------------------------------------------------------------
# Messages. One entry per thing that crosses the boundary.
#
# `faces` = which transports carry it. `op` = the wire op string, or null for a
# bus payload that is not request/reply.
# ---------------------------------------------------------------------------
protocol_v2_limits:
  max_sessions: 16
  session_idle_timeout_s: 300.0
